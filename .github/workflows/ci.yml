name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # pubspec.lock needs Dart >=3.13 beta / Flutter >=3.44, which is only
      # on the beta channel so far. Pinned: each new beta pins newer
      # SDK packages (meta, test_api, …), which breaks --enforce-lockfile.
      # Bump this together with pubspec.lock.
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: 3.51.0-0.2.pre
          cache: true

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      # Infos stay visible but don't fail the build: since 3.47 every
      # `package:flutter/material.dart` import is flagged as deprecated
      # (moving to material_ui), which older Flutters can't build with yet.
      # Warnings and errors still fail.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
