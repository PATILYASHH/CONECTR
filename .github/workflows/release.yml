name: Release

# Builds the signed APK for the version in pubspec.yaml, attaches it to
# the GitHub release v<version> (the draft, if one exists) and publishes it.
#
# Run it from the Actions tab, or: gh workflow run release.yml
#
# Needs these repository secrets (Settings → Secrets and variables →
# Actions), the same keystore every earlier release was signed with:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the job stops: a debug-signed APK can't update installs.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${full%%+*}" >> "$GITHUB_OUTPUT"
          echo "Version ${full}"

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret ($name). See the top of release.yml."
              exit 1
            fi
          done

      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Same pin as ci.yml.
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: 3.51.0-0.2.pre
          cache: true

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL / SUPABASE_ANON_KEY secrets."
            exit 1
          fi
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Package
        id: package
        run: |
          apk="connector-${{ steps.version.outputs.name }}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          NAME: Connector ${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --draft=false --latest
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "$NAME" --generate-notes --latest
          fi

      - name: Remove signing files
        if: always()
        run: rm -f android/app/release.jks android/key.properties
