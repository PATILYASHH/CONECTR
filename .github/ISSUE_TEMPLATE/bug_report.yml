name: Bug report
description: Something in Connector doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Connector
        2. Tap …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Connector version
      description: Settings → About, e.g. 1.3.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 8, Android 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove tokens, usernames and any backup contents first.
